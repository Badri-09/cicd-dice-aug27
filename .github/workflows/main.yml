name: ci pipeline
on: push

jobs:
  firstjob:
   runs-on: ubuntu-latest
   steps:
     - name: checkout
       uses: actions/checkout@v7

     - name: SonarQube Scan
       uses: SonarSource/sonarqube-scan-action@v6
       env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
       with:
        args: >
          -Dsonar.qualitygate.wait=true
          
     - name: upload artifact
       uses: actions/upload-artifact@v7
       with:
         name: dice
         path: .

  secondjob:
   needs: firstjob
   runs-on: ubuntu-latest
   steps:
     - name: download artifact
       uses: actions/download-artifact@v8
       with:
         name: dice

     - name: docker build
       run: >-
        docker build -t badri02/dice-game:v1 .
     - name: check dockerimage
       run: docker images

     - name: login to dockerhub
       uses: docker/login-action@v4
       with:
          username: ${{ vars.DOCKERHUBUSERNAME}}
          password: ${{ secrets.DOCKERHUBSECRET }}

     - name: push image
       run: docker push badri02/dice-game:v1


  thirdjob:
      needs: secondjob
      runs-on: ubuntu-latest
      steps:
       - name: aws login
         uses: appleboy/ssh-action@v1
         with:
          host: ${{ secrets.IP }}
          username: ec2-user
          key: ${{ secrets.ppk }} 
          script: |
           sudo apt update
           sudo apt install docker.io -y
           sudo systemctl start docker
           sudo systemctl enable docker

           docker --version
           docker pull badri02/dice-game:v1
           docker stop dice-game || true
           docker rm dice-game || true
           docker run -d -p 80:80 --name dice-game badri02/dice-game:v1
